
<!doctype html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Aconsegueix el teu Pokémon!</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/main.css">

    <script src="../javascript/Login.js" defer></script>
</head>

<body class="form-page">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">Home</a>
        </div>
    </nav>



    <div class="container mt-5 mb-5">

        <div class="row g-4 align-items-stretch">

            <div class="col-md-8">

                <div class="pokemon-container h-100 p-4 p-md-5 shadow">

                    <h2 class="text-center fw-bold mb-2">
                        Inicia la sessió
                    </h2>

                    <p class="text-center text-light mb-4">
                        Sigues el millor entrenador de Pokémon
                    </p>

                    <form id="formulari" onsubmit="cridaSubmit1(event)">

                        <div class="mb-3">
                            <label for="nom" class="form-label">El teu nom</label>

                            <input type="text"
                                class="form-control"
                                id="nom"
                                name="nom"
                                placeholder="Escriu el teu nom"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="DNI/NIE" class="form-label">DNI / NIE</label>

                            <input type="text"
                                class="form-control"
                                id="DNI/NIE"
                                name="DNI/NIE"
                                placeholder="Escriu el DNI/NIE"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correu electrònic</label>

                            <input type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="exemple@gmail.com"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>

                            <input type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Escriu el password"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="confirmar-password" class="form-label">
                                Confirmar Password
                            </label>

                            <input type="password"
                                class="form-control"
                                id="confirmar-password"
                                name="confirmar-password"
                                placeholder="Confirma el password"
                                required>
                        </div>

                        <div class="mb-5">
                            <label for="naixament" class="form-label">
                                Data de naixement
                            </label>

                            <input type="date"
                                class="form-control"
                                id="naixament"
                                name="naixament"
                                required
                                max="2026-11-10">
                        </div>

                        <button type="submit" class="btn btn-warning fw-bold w-100 py-2">
                            Entra!
                        </button>

                    </form>

                </div>

            </div>

            <div class="col-md-4">

                <div class="pokemon-container h-100 p-3 shadow">

                    <h3 class="text-center fw-bold mb-2">
                        El teu perfil
                    </h3>

                    <p class="text-center text-light mb-3">
                        Personalitza el teu compte!
                    </p>


                    <div class="text-center mb-3">

                        <img id="preview"
                            src="../imgs/login.jpg"
                            alt="Foto de perfil"
                            class="rounded-circle shadow mb-2"
                            style="width: 110px; height: 110px; object-fit: cover;">

                        <label for="pfp" class="form-label d-block">
                            Foto de perfil
                        </label>

                        <input type="file"
                            class="form-control"
                            id="pfp"
                            name="pfp"
                            accept="image/*">

                    </div>

                    <div class="mb-3">

                        <label for="username" class="form-label">
                            Nom d'usuari
                        </label>

                        <input type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Ex: AshTrainer"
                            required>

                    </div>
                      </select>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="bg-white text-black text-center p-3">
        <p class="mb-0">© 2025 Institut Barres i Ones</p>
    </footer>


    <script src="../javascript/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
