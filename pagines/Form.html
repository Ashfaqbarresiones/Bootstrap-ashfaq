<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aconsegueix el teu Pokémon!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #eaf4ff;
    }

    .pokemon-container {
      background-color: #102b50;
      color: white;
      max-width: 550px;
      border-radius: 18px;
    }

    .form-control, .form-select {
      padding: 12px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="../index.html">Home</a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="pokemon-container mx-auto p-4 p-md-5 shadow">
      <h2 class="text-center fw-bold mb-2">Aconsegueix el teu Pokémon!</h2>
      <p class="text-center text-light mb-4">Omple el formulari i tria el teu company d'aventures!</p>

      <form id="formulari" onsubmit="cridaSubmit1(event)">
        <div class="mb-3">
          <label for="nom" class="form-label">El teu nom</label>
          <input type="text" class="form-control" id="nom" name="nom" placeholder="Escriu el teu nom" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correu electrònic</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="exemple@gmail.com" required>
        </div>

        <div class="mb-4">
          <label for="pokemon" class="form-label">Tria el teu Pokémon</label>
          <select class="form-select" id="pokemon" name="pokemon" required>
            <option value="" selected disabled>Selecciona un Pokémon</option>
            <option value="Pikachu">Pikachu ⚡</option>
            <option value="Charmander">Charmander 🔥</option>
            <option value="Squirtle">Squirtle 💧</option>
          </select>
        </div>

        <div class="mb-5">
          <label for="date" class="form-label">Data de naixament</label><br>
          <input type="date" id="naixament" name="naixament" required max="2026-11-03">
        </div>

        <button type="submit" class="btn btn-warning fw-bold w-100 py-2">
          Aconsegueix el teu Pokémon!
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function cridaSubmit1(event) {
      event.preventDefault();

      // dades des del formulari

      const formulari = document.getElementById("formulari");
      let nom = formulari.elements["nom"].value;
      let pokemon = formulari.elements["pokemon"].value;
      let naixament = formulari.elements["naixament"].value;

      // separant la data de naixament

      if (!naixament) return;
      const [anyNaix, mesNaix, diaNaix] = naixament.split('-').map(Number);

      const avui = new Date();

      const diaActual = avui.getDate();
      const mesActual = avui.getMonth() + 1;
      const anyActual = avui.getFullYear();

      // l'edat

      let edat = anyActual - anyNaix;


      if (mesActual < mesNaix || (mesActual === mesNaix && diaActual < diaNaix)) {
        edat--;
      }

      // si té 18 anys avui

      const compleixavui = (anyActual - anyNaix === 18) && (mesActual === mesNaix) && (diaActual === diaNaix);

      // FINAL

      if (compleixavui) {
        alert("Felicitats! " + nom + " avui fas 18 anys i has escollit el pokémon" + pokemon )
      }
      else if (edat >= 18) {
        alert("Ja tens 18 anys, el teu pokemon " + pokemon + " està en camí")
      }
      else{
        alert("oops! encara no ets menor d'edat tens " + edat + " anys, torna més endavant")
      }

    }
  </script>

</body>
</html>
