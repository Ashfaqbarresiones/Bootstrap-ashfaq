
<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El meu Pokémon</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h2>Aconsegueix el teu Pokémon!</h2>

  <form>
    <div class="mb-3">
      <label for="nom" class="form-label">El teu nom</label>
      <input type="text" class="form-control" id="nom" placeholder="Escriu el teu nom">
    </div>

    <div class="mb-3">
      <label for="pokemon" class="form-label">Tria el teu Pokémon</label>
      <select class="form-select" id="pokemon">
        <option>Pikachu</option>
        <option>Charmander</option>
        <option>Squirtle</option>
      </select>
    </div>

    <button type="submit" class="btn btn-warning">Aconsegueix-lo!</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
